name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: bash packaging/macos/build_dmg.sh
          - os: windows-latest
            script: pwsh packaging/windows/build_win.ps1
          - os: ubuntu-latest
            script: bash packaging/linux/build_appimage.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Derive version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Install build deps
        shell: bash
        run: pip install pyinstaller pillow yfinance pandas numpy curl_cffi pypdf python-dateutil
      - name: Install macOS app deps (Cocoa reopen-handler)
        if: matrix.os == 'macos-latest'
        run: pip install pyobjc-framework-Cocoa
      - name: Install Inno Setup (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y
      - name: Write version file
        shell: bash
        run: printf 'from __future__ import annotations\n\n__version__ = "%s"\n' "$VERSION" > app/version.py
      - name: Build
        shell: bash
        run: ${{ matrix.script }} "$VERSION"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
